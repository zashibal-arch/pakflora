    .icon{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#8c72c8}
    .telegram .icon{background:#6fa4d7}.whatsapp .icon{background:#54b978}.phone .icon{background:#d68da4}.maps .icon{background:#f4f1ed;color:#e84d42}
    .divider{width:1px;height:34px;background:rgba(135,103,133,.5);flex:0 0 1px}

    .fineprint{margin-top:9px;font:11px/1.4 Arial,sans-serif;color:#b09a9a;letter-spacing:.12em}
    @media(min-width:600px){body{padding-top:34px}.logo{width:290px}.link{min-height:78px;padding-inline:23px}}
    @media(prefers-reduced-motion:reduce){.link{transition:none}}
